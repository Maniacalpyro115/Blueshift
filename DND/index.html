<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Soul Battle</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="game-shell">
    <canvas id="game" width="900" height="650" aria-label="Soul Battle game canvas"></canvas>
  </main>

  <div id="mobile-controls" aria-label="Touch controls">
    <div class="mobile-control-side mobile-control-side-left">
      <button id="mobile-b-button" class="mobile-action-button mobile-b-button" type="button" aria-label="Cancel or go back">B</button>
      <button id="mobile-a-button" class="mobile-action-button mobile-a-button" type="button" aria-label="Select or confirm">A</button>
    </div>
    <div class="mobile-control-side mobile-control-side-right">
      <div id="mobile-joystick" role="application" aria-label="Movement joystick">
        <div class="mobile-joystick-ring">
          <div id="mobile-joystick-knob"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="mobile-rotate-prompt" role="status">
    <span>Rotate your device to landscape</span>
  </div>

  <script src="players/party.js"></script>
  <script src="engine/player-runtime.js"></script>
  <script src="players/carian.js"></script>
  <script src="players/bravouros.js"></script>
  <script src="players/thanos.js"></script>
  <script src="players/bucky.js"></script>
  <script src="players/tarhun.js"></script>
  <script src="engine/loader.js"></script>
  <script src="enemies/sable.js"></script>
  <script src="enemies/zach.js"></script>
  <script src="enemies/dandelion.js"></script>
  <script src="engine/constants.js"></script>
  <script src="engine/utils.js"></script>
  <script src="engine/flow.js"></script>
  <script src="engine/extensions.js"></script>
  <script src="engine/defense.js"></script>
  <script src="engine/defense-runtime.js"></script>
  <script src="engine/renderers.js"></script>
  <script src="engine/presentation.js"></script>
  <script src="engine/party-actions.js"></script>
  <script src="engine/assets.js"></script>
  <script src="engine/mobile-controls.js"></script>
  <script src="engine/input.js"></script>
  <script src="engine/runtime.js"></script>
  <script src="game.js"></script>
</body>
</html>
