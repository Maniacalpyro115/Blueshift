<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>Selector navigation smoke test</title></head>
<body>
  <canvas id="game" width="900" height="650"></canvas>
  <script>window.addEventListener("error", (event) => {
    document.body.dataset.smoke = "fail";
    document.body.dataset.error = event.message;
  });</script>
  <script src="../players/party.js"></script><script src="../engine/player-runtime.js"></script>
  <script src="../players/carian.js"></script><script src="../players/bravouros.js"></script>
  <script src="../players/thanos.js"></script><script src="../players/bucky.js"></script>
  <script src="../players/tarhun.js"></script><script src="../engine/loader.js"></script>
  <script src="../enemies/sable.js"></script><script src="../enemies/zach.js"></script>
  <script src="../enemies/dandelion.js"></script>
  <script src="../engine/constants.js"></script><script src="../engine/utils.js"></script>
  <script src="../engine/flow.js"></script><script src="../engine/extensions.js"></script>
  <script src="../engine/defense.js"></script><script src="../engine/defense-runtime.js"></script>
  <script src="../engine/renderers.js"></script><script src="../engine/presentation.js"></script>
  <script src="../engine/party-actions.js"></script><script src="../engine/assets.js"></script>
  <script src="../engine/input.js"></script><script src="../engine/runtime.js"></script>
  <script src="../game.js"></script>
  <script>
    setTimeout(() => {
      if (new URLSearchParams(location.search).get("fight") === "dandelion") {
        document.body.dataset.smoke = window.SoulBattle.game?.enemy?.name === "DANDELION" ? "pass" : "fail";
      } else {
        window.SoulBattle.game.selectEncounter("dandelion");
      }
    }, 100);
  </script>
</body>
</html>
